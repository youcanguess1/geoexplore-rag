name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: ruff + mypy + pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      # uv.lock is the reproducibility anchor; fail fast if it drifts from pyproject.
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.1"
          enable-cache: true

      - name: Lockfile in sync
        run: uv lock --check

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: uv sync --locked --extra dev --python "${{ matrix.python-version }}"

      - name: Ruff format check
        run: uv run --no-sync python -m ruff format --check .

      - name: Ruff lint
        run: uv run --no-sync python -m ruff check .

      - name: Mypy
        run: uv run --no-sync python -m mypy

      - name: Pytest
        run: >-
          uv run --no-sync python -m pytest -q
          --cov=app --cov=eval
          --cov-report=term:skip-covered
          --cov-fail-under=70
          --junitxml=pytest-results.xml

      - name: Report test failures
        if: failure()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("pytest-results.xml")
          if report.exists():
              for case in ET.parse(report).iter("testcase"):
                  for result in case:
                      if result.tag in {"failure", "error"}:
                          detail = f"{case.get('classname')}.{case.get('name')}\n{result.text or result.get('message', '')}"
                          detail = detail[-6000:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                          print(f"::error title=Pytest failure::{detail}")
          PY

  frontend:
    name: frontend tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
